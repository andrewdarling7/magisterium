<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookScans Flipbook</title>
  <link rel="stylesheet" href="flipbook.css">
</head>
<body>
  <header class="toolbar">
    <button id="tocToggle" class="toc-toggle" type="button" aria-expanded="false" aria-controls="tocPanel">Contents</button>
    <div class="brand"><div class="title">BookScans</div><div class="subtitle">Flipbook viewer</div></div>
    <label>Book <select id="bookSelect"></select></label>
    <form id="pageForm" class="page-form">
      <label>Page <input id="pageInput" type="text" inputmode="text" pattern="[0-9]+[A-Za-z]*" autocomplete="off" placeholder="84 or 000d"></label>
      <button type="submit">Go</button>
    </form>
    <div id="breadcrumb" class="breadcrumb" aria-label="Current section"></div>
    <div class="spacer"></div>
    <div id="positionText" class="position"></div>
  </header>

  <div class="app-shell">
    <aside id="tocPanel" class="toc-panel" aria-label="Table of contents" aria-hidden="true">
      <div class="toc-heading"><span id="tocBookTitle"></span><button id="tocExpandAll" class="toc-expand-all" type="button">Expand All</button><button id="tocClose" class="toc-close" type="button" aria-label="Close contents">×</button></div>
      <nav id="tocTree" class="toc-tree"></nav>
      <div id="tocEmpty" class="toc-empty" hidden>No table of contents is available for this book.</div>
    </aside>

    <main>
      <section class="viewer" aria-live="polite">
        <button id="prevBtn" class="nav nav-left" type="button" aria-label="Previous scan">‹</button>
        <div id="pageStage" class="page-stage">
          <img id="pageImage" alt="">
          <div id="emptyState" class="empty-state" hidden><h2>No scans found</h2><p>Run <code>build-manifest.command</code> in this folder, then reload this page.</p></div>
        </div>
        <button id="nextBtn" class="nav nav-right" type="button" aria-label="Next scan">›</button>
      </section>
    </main>
  </div>

  <footer class="footer">
    <div class="scrubber-wrap">
      <div id="sectionMarkers" class="section-markers" aria-hidden="true"></div>
      <input id="pageSlider" class="page-slider" type="range" min="0" max="0" value="0" step="1" aria-label="Flip through scans">
      <div id="sliderBubble" class="slider-bubble" hidden></div>
    </div>
    <div class="footer-meta"><div id="fileText"></div><div class="help">←/→ previous &amp; next · Home/End first &amp; last · drag slider to flip through</div></div>
  </footer>

  <script src="manifest.js"></script>
  <script src="contents.js"></script>
  <script src="flipbook.js"></script>
</body>
</html>
